name: Build & Sign (Nuclear Fix)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Android
        run: |
          # 1. تنظيف شامل وإضافة المنصة
          rm -rf platforms/ plugins/
          cordova platform add android@13.0.0
          
          # 2. إضافة الإضافات الحديثة فقط
          cordova plugin add cordova-plugin-androidx
          cordova plugin add cordova-plugin-androidx-adapter
          cordova plugin add community-cordova-plugin-admob --variable ADMOB_APP_ID="ca-app-pub-9756015724360400~1341007605"
          
          # 3. إجبار إصدار Gradle 8.7 وتثبيت الـ Wrapper
          mkdir -p platforms/android/gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" > platforms/android/gradle/wrapper/gradle-wrapper.properties
          
          # 4. [الحل الحاسم] تعطيل AAPT2 الصارم عبر ملف build-extras.gradle
          # هذا السكريبت يخبر Gradle: "تجاهل أخطاء الـ XML في المكتبات الخارجية"
          cat <<EOF > platforms/android/app/build-extras.gradle
          android {
              aaptOptions {
                  noCompress 'txt', 'bin'
                  ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
              }
          }
          configurations.all {
              resolutionStrategy {
                  force 'com.google.android.gms:play-services-ads:23.0.0'
                  force 'com.google.android.gms:play-services-base:18.5.0'
              }
          }
          EOF

          # 5. إعدادات الخصائص
          cat <<EOF > platforms/android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.aapt2.no-optimize=true
          EOF

          # 6. إنشاء مفتاح التوقيع
          keytool -genkey -v -keystore release.keystore -alias app_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Zakaria, O=Dev, C=JP"

          # 7. البناء (محاولة بناء APK و AAB)
          cordova build android --release -- --packageType=apk
          cordova build android --release -- --packageType=bundle

          # 8. التوقيع الرقمي
          find platforms/android/app/build/outputs -name "*.apk" -exec jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore release.keystore -storepass password123 {} app_alias \;
          find platforms/android/app/build/outputs -name "*.aab" -exec jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore release.keystore -storepass password123 {} app_alias \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Packages
          path: |
            platforms/android/app/build/outputs/apk/release/*.apk
            platforms/android/app/build/outputs/bundle/release/*.aab
