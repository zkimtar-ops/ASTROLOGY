- name: Fix AdMob AndroidManifest
        run: |
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          
          echo "=== المسار ==="
          find platforms/android -name "AndroidManifest.xml" 2>/dev/null
          
          # البحث عن الملف في أي مكان
          MANIFEST=$(find platforms/android -name "AndroidManifest.xml" | head -1)
          
          if [ -z "$MANIFEST" ]; then
            echo "لم يُوجد AndroidManifest.xml"
            exit 1
          fi
          
          echo "=== الملف قبل التعديل ==="
          cat "$MANIFEST"
          
          # إضافة APPLICATION_ID
          python3 << PYEOF
          import re

          path = "$MANIFEST"
          with open(path, 'r') as f:
              content = f.read()

          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9756015724360400~1341007605"/>\n'

          if 'APPLICATION_ID' not in content:
              content = content.replace('<application', meta + '    <application', 1)
              with open(path, 'w') as f:
                  f.write(content)
              print("تم إضافة APPLICATION_ID")
          else:
              print("APPLICATION_ID موجود مسبقاً")

          print(open(path).read())
          PYEOF
