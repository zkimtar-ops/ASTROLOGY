name: Build & Sign (Deep Surgery)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Android
        run: |
          # 1. تنظيف شامل
          rm -rf platforms/ plugins/
          cordova platform add android@13.0.0
          
          # 2. إضافة الإضافات
          cordova plugin add cordova-plugin-androidx
          cordova plugin add cordova-plugin-androidx-adapter
          cordova plugin add community-cordova-plugin-admob --variable ADMOB_APP_ID="ca-app-pub-9756015724360400~1341007605"
          
          # 3. إجبار إصدار Gradle 8.7
          mkdir -p platforms/android/gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" > platforms/android/gradle/wrapper/gradle-wrapper.properties
          
          # 4. إعدادات الخصائص
          cat <<EOF > platforms/android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.aapt2.no-optimize=true
          EOF

          # 5. [الجراحة الحاسمة] - سكريبت لتنظيف الملفات التالفة قبل البناء
          # سنقوم بتشغيل Gradle مرة واحدة لتحميل المكتبات ثم نقوم بإصلاحها
          echo "Downloading dependencies..."
          ./platforms/android/gradlew -p platforms/android help || true
          
          echo "Patching all invalid resources in Gradle cache..."
          find /home/runner/.gradle/caches/transforms-4/ -name "values.xml" -exec sed -i '/common_google_signin_btn_text/d' {} + || true

          # 6. إنشاء مفتاح التوقيع
          keytool -genkey -v -keystore release.keystore -alias app_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Zakaria, O=Dev, C=JP"

          # 7. البناء النهائي
          cordova build android --release -- --packageType=apk
          cordova build android --release -- --packageType=bundle

          # 8. التوقيع
          find platforms/android/app/build/outputs -name "*.apk" -exec jarsigner -keystore release.keystore -storepass password123 {} app_alias \;
          find platforms/android/app/build/outputs -name "*.aab" -exec jarsigner -keystore release.keystore -storepass password123 {} app_alias \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Packages
          path: |
            platforms/android/app/build/outputs/apk/release/*.apk
            platforms/android/app/build/outputs/bundle/release/*.aab
