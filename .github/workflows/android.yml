name: Final Recovery Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Build Process
        run: |
          # 1. تنظيف شامل
          rm -rf platforms/ plugins/
          
          # 2. إضافة منصة أندرويد 10
          cordova platform add android@10.1.2
          
          # 3. تثبيت الإضافات
          cordova plugin add cordova-plugin-androidx
          cordova plugin add cordova-plugin-androidx-adapter
          cordova plugin add cordova-plugin-admob-free --variable ADMOB_APP_ID="ca-app-pub-9756015724360400~1341007605"
          
          # 4. [الحل العبقري] إصلاح كود كوردوفا اللي بيعمل خطأ XmlParser
          # السطر ده بيبدل المكتبة القديمة بمكتبة متوافقة مع الإصدارات الجديدة
          sed -i 's/new XmlParser(/new groovy.xml.XmlParser(/g' platforms/android/CordovaLib/cordova.gradle || true
          
          # 5. إجبار استخدام Gradle 7.5 (المستقر)
          mkdir -p platforms/android/gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip" > platforms/android/gradle/wrapper/gradle-wrapper.properties
          
          # 6. إنشاء مفتاح التوقيع
          keytool -genkey -v -keystore release.keystore -alias app_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Zakaria, O=Dev, C=JP"

          # 7. البناء النهائي
          cordova build android --release -- --packageType=apk
          cordova build android --release -- --packageType=bundle

          # 8. التوقيع
          find platforms/android/app/build/outputs -name "*.apk" -exec jarsigner -keystore release.keystore -storepass password123 {} app_alias \;
          find platforms/android/app/build/outputs -name "*.aab" -exec jarsigner -keystore release.keystore -storepass password123 {} app_alias \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Production-Files
          path: |
            platforms/android/app/build/outputs/apk/release/*.apk
            platforms/android/app/build/outputs/bundle/release/*.aab
