name: Astrology_Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova --no-audit

      - name: Create package.json if missing
        run: |
          if [ ! -f package.json ]; then
            echo '{
              "name": "hoshinomichibiki",
              "version": "1.0.0",
              "description": "Astrology App",
              "author": "Zakaria",
              "license": "ISC"
            }' > package.json
          fi

      - name: Clean Environment
        run: rm -rf platforms plugins

      - name: Add Android Platform
        run: cordova platform add android@13.0.0

      - name: Setup Gradle Wrapper
        run: |
          TOOLS_DIR="platforms/android/tools"
          mkdir -p "$TOOLS_DIR/gradle/wrapper"

          wget -q "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -O "$TOOLS_DIR/gradle/wrapper/gradle-wrapper.jar"

          cat > "$TOOLS_DIR/gradle/wrapper/gradle-wrapper.properties" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > "$TOOLS_DIR/gradlew" << 'EOF'
          #!/usr/bin/env sh
          APP_HOME="$(dirname "$0")"
          exec java \
            -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          EOF

          chmod +x "$TOOLS_DIR/gradlew"

      - name: Add Plugins
        run: |
          cordova plugin add cordova-plugin-androidx-adapter
          cordova prepare android

      - name: Configure Gradle Properties
        run: |
          cat >> platforms/android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableAapt2=false
          EOF

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -alias astro_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=Zakaria" \
            -deststoretype pkcs12

      - name: Build Release APK
        run: |
          cd platforms/android/tools
          ./gradlew -p .. assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=astro_key \
            -Pandroid.injected.signing.key.password=123456 \
            -x lint \
            --continue \
            --stacktrace 2>&1 | tail -50

      - name: Find and Copy APK
        run: |
          echo "=== البحث عن كل ملفات APK ==="
          find platforms/android -name "*.apk" 2>/dev/null

          mkdir -p output

          APK=$(find platforms/android -name "*.apk" | head -1)

          if [ -n "$APK" ]; then
            cp "$APK" output/Astrology_Final.apk
            echo "✅ تم نسخ: $APK"
          else
            echo "❌ لم يُوجد APK!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK_READY
          path: output/
          if-no-files-found: error
