name: Final_Direct_Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build
        run: |
          npm install -g cordova --no-audit
          rm -rf node_modules package-lock.json platforms plugins
          
          # إضافة المنصة والإضافات الأساسية (بدون AdMob عشان نكسر حلقة الفشل)
          cordova platform add android@13.0.0
          cordova plugin add cordova-plugin-androidx
          cordova plugin add cordova-plugin-androidx-adapter
          
          cordova prepare android

          # إجبار التوافق
          echo "android.useAndroidX=true" >> platforms/android/gradle.properties
          echo "android.enableJetifier=true" >> platforms/android/gradle.properties
          echo "android.aapt2.no-optimize=true" >> platforms/android/gradle.properties

          # إنشاء مفتاح توقيع سريع
          keytool -genkey -v -keystore release.jks -alias astro_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria" -deststoretype pkcs12

          # بناء مباشر عن طريق Gradle لتخطي تعقيدات كوردوفا
          cd platforms/android
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$(pwd)/../../release.jks -Pandroid.injected.signing.store.password=123456 -Pandroid.injected.signing.key.alias=astro_key -Pandroid.injected.signing.key.password=123456

          mkdir -p ../../output
          cp app/build/outputs/apk/release/*.apk ../../output/Astrology_Final.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: App-Ready
          path: output/
