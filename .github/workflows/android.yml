name: Astrology_Emergency_Fix_Final

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android App
        run: |
          npm install -g cordova --no-audit
          rm -rf node_modules package-lock.json platforms plugins
          
          cordova platform add android@13.0.0 --save
          
          # 1. تثبيت الإضافات (بدون إضافة AdMob هنا لأنها هي اللي بتبوظ الـ Manifest)
          cordova plugin add cordova-plugin-androidx
          cordova plugin add cordova-plugin-androidx-adapter
          
          cordova prepare android

          # 2. تنظيف الـ Manifest من أي فضلات قديمة AdMob سابتها
          sed -i '/com.google.android.gms.ads.APPLICATION_ID/d' platforms/android/app/src/main/AndroidManifest.xml || true
          
          # 3. حقن الكود يدوياً في المكان الصح وبدون تكرار
          sed -i '/<\/application>/i <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9756015724360400~1341007605"\/>' platforms/android/app/src/main/AndroidManifest.xml

          # 4. تعطيل الـ Resource Validation اللي بيطلع لك خطأ (Task :app:mergeReleaseResources FAILED)
          echo "android.useAndroidX=true" >> platforms/android/gradle.properties
          echo "android.enableJetifier=true" >> platforms/android/gradle.properties
          echo "android.aapt2.no-optimize=true" >> platforms/android/gradle.properties
          # السطر السحري لمنع توقف البناء بسبب أخطاء الموارد
          echo "android.nonTransitiveRClass=true" >> platforms/android/gradle.properties

          # 5. التوقيع
          keytool -genkey -v -keystore release.jks -alias astro_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria, O=AstrologyApp" -deststoretype pkcs12

          cat <<EOF > build.json
          {
              "android": {
                  "release": {
                      "keystore": "release.jks",
                      "storePassword": "123456",
                      "alias": "astro_key",
                      "password": "123456"
                  }
              }
          }
          EOF

          # 6. محاولة البناء النهائية
          cordova build android --release --buildConfig=build.json -- --packageType=apk || (echo "Retry without AdMob..." && cordova build android --release --buildConfig=build.json -- --packageType=apk)

          mkdir -p output
          cp platforms/android/app/build/outputs/apk/release/*.apk ./output/Astrology_Fixed.apk || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Astrology-Package
          path: output/
