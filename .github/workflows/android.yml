name: Astrology_Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Cordova
        run: npm install -g cordova --no-audit

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            echo '{
              "name": "hoshinomichibiki",
              "version": "1.0.0",
              "description": "Astrology App",
              "author": "Zakaria",
              "license": "ISC"
            }' > package.json
          fi

      - name: Clean Environment
        run: rm -rf platforms plugins

      - name: Add Android Platform
        run: cordova platform add android@13.0.0

      - name: Add Plugins
        run: |
          cordova plugin add cordova-plugin-androidx-adapter
          cordova prepare android

      - name: Configure Gradle Properties
        run: |
          cat >> platforms/android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Force upgrade play-services in build.gradle
        run: |
          # إضافة إصدار جديد لـ play-services في dependencies
          cat >> platforms/android/app/build.gradle << 'EOF'

          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'com.google.android.gms') {
                      if (details.requested.name == 'play-services-base') {
                          details.useVersion '18.3.0'
                          details.because 'Fix Invalid color in old version'
                      }
                      if (details.requested.name == 'play-services-basement') {
                          details.useVersion '18.3.0'
                          details.because 'Fix Invalid color in old version'
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle Wrapper
        run: |
          TOOLS_DIR="platforms/android/tools"
          mkdir -p "$TOOLS_DIR/gradle/wrapper"

          cp /usr/local/lib/android/sdk/extras/google/google_play_services/samples/unified/ActivityDemo/gradle/wrapper/gradle-wrapper.jar \
            "$TOOLS_DIR/gradle/wrapper/gradle-wrapper.jar"

          cat > "$TOOLS_DIR/gradle/wrapper/gradle-wrapper.properties" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > "$TOOLS_DIR/gradlew" << 'GRADLEW'
          #!/usr/bin/env sh
          APP_HOME="$(cd "$(dirname "$0")" && pwd)"
          exec java -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW

          chmod +x "$TOOLS_DIR/gradlew"

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore ${{ github.workspace }}/release.jks \
            -alias astro_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=Zakaria" \
            -deststoretype pkcs12

      - name: Fix play-services-base-11.0.4 bad values.xml
        run: |
          GRADLEW="platforms/android/tools/gradlew"

          # تشغيل أول مرة لتحميل الـ dependencies
          "$GRADLEW" -p platforms/android :app:mergeReleaseResources \
            -x lint 2>/dev/null || true

          # البحث عن الملف المشكل وإصلاحه
          BAD_FILE=$(find /home/runner/.gradle/caches/transforms-4 \
            -path "*/jetified-play-services-base-11.0.4/res/values/values.xml" \
            2>/dev/null | head -1)

          if [ -n "$BAD_FILE" ]; then
            echo "✅ وجدنا الملف المشكل: $BAD_FILE"
            echo "=== المحتوى قبل الإصلاح ==="
            cat "$BAD_FILE"
            
            # إصلاح قيم اللون غير الصالحة باستخدام Python
            python3 << PYEOF
          import re

          path = "$BAD_FILE"
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          print("Before fix:")
          print(content)

          # إصلاح قيم اللون غير الصالحة
          fixed = re.sub(
              r'<color name="[^"]*">[^<]*</color>',
              lambda m: m.group(0) if re.search(r'#[0-9A-Fa-f]{3,8}', m.group(0)) else '',
              content
          )

          with open(path, 'w', encoding='utf-8') as f:
              f.write(fixed)

          print("After fix:")
          print(fixed)
          PYEOF
          else
            echo "⚠️ الملف غير موجود في cache بعد"
            find /home/runner/.gradle/caches/transforms-4 -name "values.xml" 2>/dev/null | head -10
          fi

      - name: Build APK and AAB
        run: |
          GRADLEW="platforms/android/tools/gradlew"

          echo "=== بناء APK ==="
          "$GRADLEW" -p platforms/android :app:assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=astro_key \
            -Pandroid.injected.signing.key.password=123456 \
            -x lint 2>&1

          echo "=== بناء AAB ==="
          "$GRADLEW" -p platforms/android :app:bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=astro_key \
            -Pandroid.injected.signing.key.password=123456 \
            -x lint 2>&1
        continue-on-error: true

      - name: Copy Output Files
        run: |
          mkdir -p output

          APK=$(find platforms/android -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" output/Astrology_Final.apk
            echo "✅ APK موجود"
          else
            echo "⚠️ لا يوجد APK"
          fi

          AAB=$(find platforms/android -name "*.aab" | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" output/Astrology_Final.aab
            echo "✅ AAB موجود"
          else
            echo "⚠️ لا يوجد AAB"
          fi

          ls -la output/
          if [ -z "$(ls -A output/)" ]; then
            echo "❌ لا يوجد أي ملف!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK_READY
          path: output/Astrology_Final.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AAB_READY
          path: output/Astrology_Final.aab
          if-no-files-found: warn
