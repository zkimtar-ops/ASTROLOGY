name: Astrology_Final_Success

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build
        run: |
          npm install -g cordova --no-audit
          rm -rf platforms plugins node_modules
          
          # 1. إضافة المنصة
          cordova platform add android@13.0.0
          
          # 2. إزالة الإضافات القديمة اللي بتعمل تعارض مع أندرويد 13
          cordova plugin remove cordova-plugin-whitelist || true
          cordova plugin add cordova-plugin-androidx-adapter
          
          # 3. توليد ملفات البناء (مهم جداً)
          cordova prepare android

          # 4. إعدادات التوافق
          echo "android.useAndroidX=true" >> platforms/android/gradle.properties
          echo "android.enableJetifier=true" >> platforms/android/gradle.properties
          echo "android.aapt2.no-optimize=true" >> platforms/android/gradle.properties
          
          # 5. إنشاء المفتاح
          keytool -genkey -v -keystore release.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria" -deststoretype pkcs12

          # 6. البحث عن gradlew وتشغيله أياً كان مكانه
          cd platforms/android
          find . -name gradlew -exec chmod +x {} +
          
          # استخدام أمر كوردوفا المباشر للبناء لأنه أضمن في التعامل مع المسارات
          cd ../..
          cordova build android --release -- --packageType=apk \
            --keystore=release.jks --storePassword=123456 --alias=key0 --password=123456

          # 7. تجميع الملف النهائي
          mkdir -p output
          find platforms/android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output/Final_Astrology.apk \;

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: APK_READY
          path: output/
