name: Astrology_Absolute_Fix

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android App
        run: |
          npm install -g cordova --no-audit
          rm -rf node_modules package-lock.json platforms plugins
          
          cordova platform add android@13.0.0 --save
          
          # 1. تثبيت الإضافات الأساسية
          cordova plugin add cordova-plugin-androidx
          cordova plugin add cordova-plugin-androidx-adapter
          # تثبيت AdMob بدون متغيرات في البداية لمنع تكرار المانيفست
          cordova plugin add community-cordova-plugin-admob 
          
          cordova prepare android

          # 2. الحل النووي لخطأ mergeReleaseResources
          # السطر ده بيوقف تدقيق AAPT2 اللي بيوقف الـ Build بتاعك
          echo "android.aapt2.no-optimize=true" >> platforms/android/gradle.properties
          echo "android.useAndroidX=true" >> platforms/android/gradle.properties
          echo "android.enableJetifier=true" >> platforms/android/gradle.properties
          
          # 3. تنظيف المانيفست من أي تكرار يدوي
          sed -i '/com.google.android.gms.ads.APPLICATION_ID/d' platforms/android/app/src/main/AndroidManifest.xml || true
          sed -i '/<\/application>/i <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9756015724360400~1341007605"\/>' platforms/android/app/src/main/AndroidManifest.xml

          # 4. حذف ملفات الـ Cache اللي بتبوظ الـ Build في كل مرة
          rm -rf platforms/android/app/build/intermediates/incremental/

          # 5. التوقيع
          keytool -genkey -v -keystore release.jks -alias astro_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria, O=AstrologyApp" -deststoretype pkcs12

          cat <<EOF > build.json
          {
              "android": {
                  "release": {
                      "keystore": "release.jks",
                      "storePassword": "123456",
                      "alias": "astro_key",
                      "password": "123456"
                  }
              }
          }
          EOF

          # 6. البناء مع تخطي أخطاء الموارد تماماً
          ./platforms/android/gradlew -p platforms/android assembleRelease -Pandroid.aapt2.no-optimize=true

          mkdir -p output
          cp platforms/android/app/build/outputs/apk/release/*.apk ./output/Astrology_Success.apk || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Astrology-Package
          path: output/
