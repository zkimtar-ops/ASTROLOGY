- name: Fix AGP Compatibility
        run: |
          # تعديل إصدار Android Gradle Plugin في build.gradle
          sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.3.0/" \
            platforms/android/build.gradle || true
          
          echo "=== build.gradle الحالي ==="
          cat platforms/android/build.gradle

      - name: Build Release APK and AAB
        run: |
          cd platforms/android/tools
          ./gradlew -p .. assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=astro_key \
            -Pandroid.injected.signing.key.password=123456 \
            -x lint \
            --info 2>&1 | grep -E "FAILED|ERROR|error:|warning:|BUILD" | head -30
