name: Build & Auto-Sign (APK & AAB)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11' # العودة للإصدار 11 لضمان توافق Gradle Wrapper
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Process
        run: |
          # إنشاء المشروع
          cordova create build_dir com.zakaria.hoshinomichibiki "星の導き"
          
          # نسخ الملفات الأساسية
          cp config.xml build_dir/
          if [ -d "www" ]; then cp -r www/* build_dir/www/; fi
          
          cd build_dir
          
          # إضافة منصة أندرويد (إصدار مستقر جداً)
          cordova platform add android@11.0.0
          
          # تثبيت الإضافة
          cordova plugin add cordova-plugin-admob-free --variable ADMOB_APP_ID="ca-app-pub-9756015724360400~1341007605"
          
          # إنشاء مفتاح التوقيع
          keytool -genkey -v -keystore release.keystore -alias app_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Zakaria, O=Dev, C=JP"

          # البدء بالبناء
          echo "Building APK..."
          cordova build android --release -- --packageType=apk
          
          echo "Building AAB..."
          cordova build android --release -- --packageType=bundle

          # التوقيع الرقمي
          find platforms/android/app/build/outputs/apk/release -name "*.apk" -exec jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore release.keystore -storepass password123 {} app_alias \;
          find platforms/android/app/build/outputs/bundle/release -name "*.aab" -exec jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore release.keystore -storepass password123 {} app_alias \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Packages
          path: |
            build_dir/platforms/android/app/build/outputs/apk/release/*.apk
            build_dir/platforms/android/app/build/outputs/bundle/release/*.aab
