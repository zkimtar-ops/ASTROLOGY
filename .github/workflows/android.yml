name: Astrology_Final_Success

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build
        run: |
          npm install -g cordova --no-audit
          rm -rf platforms plugins node_modules
          
          # 1. إضافة المنصة (أندرويد 13)
          cordova platform add android@13.0.0
          
          # 2. تثبيت الإضافات (بدون AdMob خالص عشان نضمن الـ Build)
          cordova plugin add cordova-plugin-androidx-adapter
          
          cordova prepare android

          # 3. إعدادات التوافق
          echo "android.useAndroidX=true" >> platforms/android/gradle.properties
          echo "android.enableJetifier=true" >> platforms/android/gradle.properties
          echo "android.aapt2.no-optimize=true" >> platforms/android/gradle.properties
          
          # 4. إنشاء المفتاح
          keytool -genkey -v -keystore release.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria" -deststoretype pkcs12

          # 5. البناء (المسار الصحيح لـ gradlew)
          cd platforms/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../../release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=key0 \
            -Pandroid.injected.signing.key.password=123456

          # 6. تجميع الملف النهائي
          mkdir -p ../../output
          cp app/build/outputs/apk/release/*.apk ../../output/Final_Astrology.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: APK_READY
          path: output/
