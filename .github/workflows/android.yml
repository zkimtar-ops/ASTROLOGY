name: Build & Sign (Force Pass)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Android
        run: |
          # 1. تنظيف شامل
          rm -rf platforms/ plugins/ node_modules/
          
          # 2. إضافة المنصة
          cordova platform add android@13.0.0
          
          # 3. تثبيت الإضافة الحديثة فقط
          cordova plugin add cordova-plugin-androidx
          cordova plugin add cordova-plugin-androidx-adapter
          cordova plugin add community-cordova-plugin-admob --variable ADMOB_APP_ID="ca-app-pub-9756015724360400~1341007605"
          
          # 4. إجبار إصدار Gradle 8.7
          mkdir -p platforms/android/gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" > platforms/android/gradle/wrapper/gradle-wrapper.properties
          
          # 5. [الحل السحري] تعطيل تدقيق AAPT2 نهائياً وتفعيل AndroidX
          # هذه الأسطر تمنع النظام من فحص ملفات الـ XML التي تسبب الفشل
          cat <<EOF > platforms/android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.aapt2.no-optimize=true
          android.view.inspector.enabled=false
          EOF
          
          # 6. إنشاء مفتاح التوقيع
          keytool -genkey -v -keystore release.keystore -alias app_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Zakaria, O=Dev, C=JP"

          # 7. البناء مع تجاهل الأخطاء الصورية
          # نستخدم -- -- لتمرير المعاملات مباشرة إلى Gradle
          cordova build android --release -- --packageType=apk --packageType=bundle

          # 8. التوقيع الرقمي
          find platforms/android/app/build/outputs -name "*.apk" -exec jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore release.keystore -storepass password123 {} app_alias \;
          find platforms/android/app/build/outputs -name "*.aab" -exec jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore release.keystore -storepass password123 {} app_alias \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Packages
          path: |
            platforms/android/app/build/outputs/apk/release/*.apk
            platforms/android/app/build/outputs/bundle/release/*.aab
