name: Astrology_Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Cordova
        run: npm install -g cordova --no-audit

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            echo '{
              "name": "hoshinomichibiki",
              "version": "1.0.0",
              "description": "Astrology App",
              "author": "Zakaria",
              "license": "ISC"
            }' > package.json
          fi

      - name: Clean Environment
        run: rm -rf platforms plugins

      - name: Add Android Platform
        run: cordova platform add android@13.0.0

      - name: Add Plugins
        run: |
          cordova plugin add cordova-plugin-androidx-adapter
          cordova prepare android

      - name: Configure Gradle Properties
        run: |
          cat >> platforms/android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Setup Gradle Wrapper
        run: |
          TOOLS_DIR="platforms/android/tools"
          mkdir -p "$TOOLS_DIR/gradle/wrapper"

          cp /usr/local/lib/android/sdk/extras/google/google_play_services/samples/unified/ActivityDemo/gradle/wrapper/gradle-wrapper.jar \
            "$TOOLS_DIR/gradle/wrapper/gradle-wrapper.jar"

          cat > "$TOOLS_DIR/gradle/wrapper/gradle-wrapper.properties" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > "$TOOLS_DIR/gradlew" << 'GRADLEW'
          #!/usr/bin/env sh
          APP_HOME="$(cd "$(dirname "$0")" && pwd)"
          exec java -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW

          chmod +x "$TOOLS_DIR/gradlew"

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore ${{ github.workspace }}/release.jks \
            -alias astro_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=Zakaria" \
            -deststoretype pkcs12

      - name: First build to download dependencies
        run: |
          GRADLEW="platforms/android/tools/gradlew"
          "$GRADLEW" -p platforms/android :app:mergeReleaseResources \
            -x lint 2>/dev/null || true

      - name: Fix all bad values.xml in gradle cache
        run: |
          python3 << 'PYEOF'
          import os
          import re

          cache_dir = os.path.expanduser("~/.gradle/caches")
          fixed_count = 0

          for root, dirs, files in os.walk(cache_dir):
              for fname in files:
                  if fname == "values.xml":
                      fpath = os.path.join(root, fname)
                      try:
                          with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          
                          # عرض الملفات التي تحتوي على color
                          if '<color' in content:
                              print(f"\n=== {fpath} ===")
                              print(content[:500])
                              
                              # حذف أي عنصر color يحتوي على قيمة غير صالحة (ليست hex)
                              fixed = re.sub(
                                  r'\s*<color\s+name="[^"]*">[^#<][^<]*</color>',
                                  '',
                                  content
                              )
                              
                              if fixed != content:
                                  with open(fpath, 'w', encoding='utf-8') as f:
                                      f.write(fixed)
                                  print(f"✅ Fixed: {fpath}")
                                  fixed_count += 1
                      except Exception as e:
                          print(f"Error processing {fpath}: {e}")

          print(f"\nTotal fixed: {fixed_count}")
          PYEOF

      - name: Build APK and AAB
        run: |
          GRADLEW="platforms/android/tools/gradlew"

          # مسح build السابق
          rm -rf platforms/android/app/build/intermediates

          echo "=== بناء APK ==="
          "$GRADLEW" -p platforms/android :app:assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=astro_key \
            -Pandroid.injected.signing.key.password=123456 \
            -x lint 2>&1

          echo "=== بناء AAB ==="
          "$GRADLEW" -p platforms/android :app:bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=astro_key \
            -Pandroid.injected.signing.key.password=123456 \
            -x lint 2>&1
        continue-on-error: true

      - name: Copy Output Files
        run: |
          mkdir -p output

          APK=$(find platforms/android -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" output/Astrology_Final.apk
            echo "✅ APK: $APK"
          else
            echo "⚠️ لا يوجد APK"
          fi

          AAB=$(find platforms/android -name "*.aab" | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" output/Astrology_Final.aab
            echo "✅ AAB: $AAB"
          else
            echo "⚠️ لا يوجد AAB"
          fi

          ls -la output/
          if [ -z "$(ls -A output/)" ]; then
            echo "❌ لا يوجد أي ملف!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK_READY
          path: output/Astrology_Final.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AAB_READY
          path: output/Astrology_Final.aab
          if-no-files-found: warn
