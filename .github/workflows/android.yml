name: Build & Sign (Final Success)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Android
        run: |
          # 1. إضافة المنصة
          cordova platform add android@13.0.0
          
          # 2. تثبيت الإضافات الحديثة (تم تغيير AdMob إلى النسخة المتوافقة)
          cordova plugin add cordova-plugin-androidx
          cordova plugin add cordova-plugin-androidx-adapter
          # استخدمنا النسخة الحديثة هنا لتجنب خطأ الـ Resources
          cordova plugin add community-cordova-plugin-admob --variable ADMOB_APP_ID="ca-app-pub-9756015724360400~1341007605"
          
          # 3. إجبار استخدام Gradle 8.7
          mkdir -p platforms/android/gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" > platforms/android/gradle/wrapper/gradle-wrapper.properties
          
          # 4. إعدادات AndroidX الصارمة
          echo "android.useAndroidX=true" >> platforms/android/gradle.properties
          echo "android.enableJetifier=true" >> platforms/android/gradle.properties
          
          # 5. إنشاء مفتاح التوقيع
          keytool -genkey -v -keystore release.keystore -alias app_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Zakaria, O=Dev, C=JP"

          # 6. البناء
          echo "Building APK and AAB..."
          cordova build android --release -- --packageType=apk
          cordova build android --release -- --packageType=bundle

          # 7. التوقيع الرقمي
          find platforms/android/app/build/outputs/apk/release -name "*.apk" -exec jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore release.keystore -storepass password123 {} app_alias \;
          find platforms/android/app/build/outputs/bundle/release -name "*.aab" -exec jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore release.keystore -storepass password123 {} app_alias \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Packages
          path: |
            platforms/android/app/build/outputs/apk/release/*.apk
            platforms/android/app/build/outputs/bundle/release/*.aab
