name: Build & Sign (Surgery Mode)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Android
        run: |
          # 1. إضافة المنصة والإضافات
          cordova platform add android@13.0.0
          cordova plugin add cordova-plugin-androidx
          cordova plugin add cordova-plugin-androidx-adapter
          cordova plugin add community-cordova-plugin-admob --variable ADMOB_APP_ID="ca-app-pub-9756015724360400~1341007605"
          
          # 2. إجبار Gradle 8.7
          mkdir -p platforms/android/gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" > platforms/android/gradle/wrapper/gradle-wrapper.properties
          
          # 3. إعدادات AndroidX
          cat <<EOF > platforms/android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.aapt2.no-optimize=true
          EOF

          # 4. الجراحة اليدوية: إصلاح ملف القيم المعطوب في مكتبة جوجل
          # هذا الأمر سيبحث عن أي ملف values.xml يحتوي على تعريف لون غير صالح ويقوم بتنظيفه
          echo "Patching Google Play Services resource error..."
          find /home/runner/.gradle/caches/transforms-4/ -name "values.xml" -exec sed -i 's|<color name="common_google_signin_btn_text_dark_default">@.*</color>|<color name="common_google_signin_btn_text_dark_default">#ffffff</color>|g' {} + || true

          # 5. إنشاء المفتاح
          keytool -genkey -v -keystore release.keystore -alias app_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Zakaria, O=Dev, C=JP"

          # 6. البناء
          cordova build android --release -- --packageType=apk
          cordova build android --release -- --packageType=bundle

          # 7. التوقيع
          find platforms/android/app/build/outputs -name "*.apk" -exec jarsigner -keystore release.keystore -storepass password123 {} app_alias \;
          find platforms/android/app/build/outputs -name "*.aab" -exec jarsigner -keystore release.keystore -storepass password123 {} app_alias \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Packages
          path: |
            platforms/android/app/build/outputs/apk/release/*.apk
            platforms/android/app/build/outputs/bundle/release/*.aab
