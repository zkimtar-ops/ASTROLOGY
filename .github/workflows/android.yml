name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4 # تحديث لـ v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4 # تحديث لـ v4
        with:
          java-version: '17' # استخدام إصدار أحدث متوافق مع Gradle الجديد
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4 # تحديث لـ v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Project and Build APK
        run: |
          cordova create build_dir com.zakaria.hoshinomichibiki "星の導き"
          cp config.xml build_dir/
          cd build_dir
          cordova platform add android
          # ملاحظة: تأكد من صحة معرف التطبيق أدناه
          cordova plugin add cordova-plugin-admob-free --variable ADMOB_APP_ID="ca-app-pub-9756015724360400~1341007605"
          rm -rf www/*
          cp -r ../www/* www/
          cordova build android --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hoshi-no-Michibiki-APK
          path: build_dir/platforms/android/app/build/outputs/apk/release/*.apk
