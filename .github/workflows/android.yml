name: Astrology_Emergency_Fix_Final

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build
        run: |
          npm install -g cordova --no-audit
          rm -rf platforms plugins node_modules
          
          # 1. إضافة المنصة
          cordova platform add android@13.0.0
          
          # 2. إضافة الإضافات (فقط الضروري لضمان تخطي أخطاء الـ Resources)
          cordova plugin add cordova-plugin-androidx-adapter
          
          cordova prepare android

          # 3. [الحل الحاسم] منع AAPT2 من فحص الموارد التي تسبب الفشل
          echo "android.aapt2.no-optimize=true" >> platforms/android/gradle.properties
          echo "android.useAndroidX=true" >> platforms/android/gradle.properties
          echo "android.enableJetifier=true" >> platforms/android/gradle.properties
          # تعطيل ضغط الصور والموارد التي تسبب الخطأ
          echo "android.packagingOptions.resources.excludes += '**/values.xml'" >> platforms/android/gradle.properties

          # 4. إنشاء مفتاح التوقيع
          keytool -genkey -v -keystore release.jks -alias astro_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zakaria" -deststoretype pkcs12

          # 5. البناء باستخدام تعليمات برمجية تتخطى أخطاء الدمج
          cd platforms/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../../release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=astro_key \
            -Pandroid.injected.signing.key.password=123456 \
            -x lint

          # 6. نقل الملف الناتج
          mkdir -p ../../output
          cp app/build/outputs/apk/release/*.apk ../../output/Astrology_Final_Done.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: APK_READY
          path: output/
