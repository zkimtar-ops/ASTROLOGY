name: Astrology_Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Cordova
        run: npm install -g cordova --no-audit

      - name: Install Pillow
        run: pip install Pillow --break-system-packages --quiet

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            echo '{
              "name": "hoshinomichibiki",
              "version": "1.0.0",
              "description": "Astrology App",
              "author": "Zakaria",
              "license": "ISC"
            }' > package.json
          fi

      - name: Generate Icons and Splash from www/1777490720589.png
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os

          src = 'www/1777490720589.png'
          print(f"✅ الأيقونة المصدر: {src}")

          os.makedirs('res/screen/android', exist_ok=True)
          img = Image.open(src).convert('RGBA')

          # أيقونات
          icons = {
              'res/icon.png': 512,
              'res/icon-48.png': 48,
              'res/icon-72.png': 72,
              'res/icon-96.png': 96,
              'res/icon-144.png': 144,
              'res/icon-192.png': 192,
          }
          for filename, size in icons.items():
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(filename)
              print(f"✅ أيقونة: {filename} ({size}x{size})")

          # سبلاش - إنشاء صورة بخلفية سوداء والأيقونة في المنتصف
          splash_sizes = {
              'res/screen/android/splash-land-hdpi.png':  (800, 480),
              'res/screen/android/splash-land-ldpi.png':  (320, 200),
              'res/screen/android/splash-land-mdpi.png':  (480, 320),
              'res/screen/android/splash-land-xhdpi.png': (1280, 720),
              'res/screen/android/splash-port-hdpi.png':  (480, 800),
              'res/screen/android/splash-port-ldpi.png':  (200, 320),
              'res/screen/android/splash-port-mdpi.png':  (320, 480),
              'res/screen/android/splash-port-xhdpi.png': (720, 1280),
          }

          for filename, (w, h) in splash_sizes.items():
              # خلفية سوداء
              bg = Image.new('RGBA', (w, h), (0, 0, 0, 255))
              # حجم الأيقونة = 40% من أصغر بعد
              icon_size = int(min(w, h) * 0.4)
              icon = img.resize((icon_size, icon_size), Image.LANCZOS)
              # وضع الأيقونة في المنتصف
              x = (w - icon_size) // 2
              y = (h - icon_size) // 2
              bg.paste(icon, (x, y), icon)
              bg.save(filename)
              print(f"✅ سبلاش: {filename} ({w}x{h})")
          PYEOF

      - name: Create config.xml
        run: |
          cat > config.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.zakaria.hoshinomichibiki" version="1.0.0"
            xmlns="http://www.w3.org/ns/widgets"
            xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>星の導き</name>
            <description>Astrology App</description>
            <author email="zakaria@example.com" href="http://example.com">Zakaria</author>
            <content src="index.html" />
            <allow-navigation href="*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />

            <!-- السبلاش -->
            <preference name="SplashScreenDelay" value="2000" />
            <preference name="AutoHideSplashScreen" value="true" />
            <preference name="FadeSplashScreen" value="true" />
            <preference name="FadeSplashScreenDuration" value="500" />
            <preference name="SplashScreenBackgroundColor" value="#000000" />
            <preference name="ShowSplashScreenSpinner" value="false" />

            <platform name="android">
              <allow-intent href="market:*" />

              <!-- الأيقونة -->
              <icon src="res/icon.png" />
              <icon density="mdpi"    src="res/icon-48.png" />
              <icon density="hdpi"    src="res/icon-72.png" />
              <icon density="xhdpi"   src="res/icon-96.png" />
              <icon density="xxhdpi"  src="res/icon-144.png" />
              <icon density="xxxhdpi" src="res/icon-192.png" />

              <!-- السبلاش -->
              <splash density="land-hdpi"  src="res/screen/android/splash-land-hdpi.png" />
              <splash density="land-ldpi"  src="res/screen/android/splash-land-ldpi.png" />
              <splash density="land-mdpi"  src="res/screen/android/splash-land-mdpi.png" />
              <splash density="land-xhdpi" src="res/screen/android/splash-land-xhdpi.png" />
              <splash density="port-hdpi"  src="res/screen/android/splash-port-hdpi.png" />
              <splash density="port-ldpi"  src="res/screen/android/splash-port-ldpi.png" />
              <splash density="port-mdpi"  src="res/screen/android/splash-port-mdpi.png" />
              <splash density="port-xhdpi" src="res/screen/android/splash-port-xhdpi.png" />
            </platform>
          </widget>
          EOF

      - name: Clean Environment
        run: rm -rf platforms plugins

      - name: Add Android Platform
        run: cordova platform add android@13.0.0

      - name: Add Plugins
        run: |
          cordova plugin add cordova-plugin-androidx-adapter
          cordova plugin add cordova-plugin-splashscreen
          cordova plugin add admob-plus-cordova \
            --variable APP_ID_ANDROID="ca-app-pub-9756015724360400~7044151619"
          cordova prepare android

      - name: Configure Gradle Properties
        run: |
          cat >> platforms/android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Setup Gradle Wrapper
        run: |
          TOOLS_DIR="platforms/android/tools"
          mkdir -p "$TOOLS_DIR/gradle/wrapper"

          cp /usr/local/lib/android/sdk/extras/google/google_play_services/samples/unified/ActivityDemo/gradle/wrapper/gradle-wrapper.jar \
            "$TOOLS_DIR/gradle/wrapper/gradle-wrapper.jar"

          cat > "$TOOLS_DIR/gradle/wrapper/gradle-wrapper.properties" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > "$TOOLS_DIR/gradlew" << 'GRADLEW'
          #!/usr/bin/env sh
          APP_HOME="$(cd "$(dirname "$0")" && pwd)"
          exec java -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW

          chmod +x "$TOOLS_DIR/gradlew"

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore ${{ github.workspace }}/release.jks \
            -alias astro_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=Zakaria" \
            -deststoretype pkcs12

      - name: Build APK and AAB
        run: |
          GRADLEW="platforms/android/tools/gradlew"

          echo "=== بناء APK ==="
          "$GRADLEW" -p platforms/android :app:assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=astro_key \
            -Pandroid.injected.signing.key.password=123456 \
            -x lint 2>&1

          echo "=== بناء AAB ==="
          "$GRADLEW" -p platforms/android :app:bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=astro_key \
            -Pandroid.injected.signing.key.password=123456 \
            -x lint 2>&1
        continue-on-error: true

      - name: Copy Output Files
        run: |
          mkdir -p output

          APK=$(find platforms/android -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" output/Astrology_Final.apk
            echo "✅ APK: $APK"
          else
            echo "⚠️ لا يوجد APK"
          fi

          AAB=$(find platforms/android -name "*.aab" | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" output/Astrology_Final.aab
            echo "✅ AAB: $AAB"
          else
            echo "⚠️ لا يوجد AAB"
          fi

          ls -la output/
          if [ -z "$(ls -A output/)" ]; then
            echo "❌ لا يوجد أي ملف!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK_READY
          path: output/Astrology_Final.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AAB_READY
          path: output/Astrology_Final.aab
          if-no-files-found: warn
